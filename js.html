
<script>
    var a=90
    var b=70
    var c=55
    var d=42
    var e=33
    var total =a+b+c+d+e
    document.write(total)
    var avg = total/5
    document.write(avg)
    if(avg >=75){
        document.write("grade A" , avg)
    }
    else if(avg >=60){
        document.write("Grade B" , avg)
    }
     else if(avg >=56){
        document.write("Grade C" , avg)
    }
     else if(avg >=46){
        document.write("Grade D" , avg)
    }
    
</script>
